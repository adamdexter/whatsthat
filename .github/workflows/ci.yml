name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + e2e (mock WhatsApp)
    runs-on: macos-14
    timeout-minutes: 20
    env:
      # Tests run the engine in mock mode; no browser is ever launched.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
